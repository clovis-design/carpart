
services:

  api_client:
    build:
      context: ./carpart-client-api
      dockerfile: Dockerfile.api
    container_name: carpart-api-client
    ports:
      - "7000:7000"
    environment:
      - MYSQL_HOST=mysql_client
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=carpart_clients
      - MYSQL_USER=carpart
      - MYSQL_PASSWORD=carpart_dev
    depends_on:
      mysql_client:
        condition: service_healthy

  mysql_client:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: carpart_clients
      MYSQL_USER: carpart
      MYSQL_PASSWORD: carpart_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3307:3306"
    volumes:
      - mysql_client:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  
  api_product:
    build:
      context: ./carpart-api
      dockerfile: Dockerfile.api
    container_name: carpart-api-product
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo_product:27017
      - MONGO_DB=carpartProduct
      - MONGO_COLLECTION=products

  mongo_product:
    image: mongo:7.0
    container_name: mongoProduct
    ports:
      - "2701:27017"
    volumes:
      - mongo_product:/data/db
  
volumes:
  mongo_client:
  mysql_client:
  mongo_product:
