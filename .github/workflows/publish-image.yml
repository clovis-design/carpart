name: Publish Carpart Image

on:
  push:
    branches: main

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r /carpart-api/requirements.txt
          pip install -r /carpart-client-api/requirements.txt

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build and Push Carpart API Image
        uses: docker/build-push-action@v6
        with:
          context: ./carpart-api
          file: ./carpart-api/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/carpart_api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/carpart_api:latest


      - name: Build and Push Carpart Client API Image
        uses: docker/build-push-action@v6
        with:
          context: ./carpart-client-api
          file: ./carpart-client-api/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/carpart_client_api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/carpart_client_api:latest

